<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เทรซรูป</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#15171a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#15171a;--panel:#22262bee;--ink:#f2f3f5;--mute:#9aa1a9;--accent:#ffcf3f;--accent-ink:#1b1500;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15171a}}
:root[data-theme="dark"]{--bg:#15171a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;overflow:hidden}
#stage{position:absolute;inset:0;touch-action:none;overflow:hidden}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#pic{position:absolute;left:50%;top:50%;max-width:80%;max-height:80%;transform-origin:center;will-change:transform;user-select:none;-webkit-user-drag:none;pointer-events:none}
#start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px;text-align:center}
#start h1{font-size:28px;margin:0}
#start .note{font-size:13px;max-width:34ch}
#start p{margin:0;color:var(--mute);max-width:30ch;line-height:1.6}
button,label.btn{font:inherit;color:var(--ink);background:#343a41;border:0;border-radius:12px;padding:12px 16px;min-height:46px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button.primary,label.primary{background:var(--accent);color:var(--accent-ink);font-weight:700}
button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
button:focus-visible,label.btn:focus-within{outline:3px solid #fff;outline-offset:2px}
#bar{position:absolute;left:0;right:0;bottom:0;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));background:var(--panel);display:none;flex-direction:column;gap:10px;border-radius:18px 18px 0 0}
#bar.on{display:flex}
.row{display:flex;gap:8px}
.row>*{flex:1}
.slider{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mute)}
.slider input{flex:1;accent-color:var(--accent);height:32px}
#msg{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;right:12px;background:#3a1d1d;color:#ffd7d7;padding:12px 14px;border-radius:12px;display:none;line-height:1.5}
input[type=file]{display:none}
body.locked #stage{touch-action:auto}
</style>
</head>
<body>
<div id="stage">
  <video id="cam" playsinline muted autoplay></video>
  <img id="pic" alt="" hidden>
</div>
<div id="msg" role="alert"></div>

<div id="start">
  <h1>เทรซรูป</h1>
  <p>เปิดกล้องหลัง เลือกรูป แล้ววางทับกระดาษเพื่อวาดตามได้เลย</p>
  <button class="primary" id="go">เปิดกล้อง</button>
  <p class="note">รูปที่นำมาเทรซต้องเป็นของคุณหรือได้รับอนุญาตให้ใช้ ผู้ใช้เป็นผู้รับผิดชอบเรื่องลิขสิทธิ์ของรูปเอง รูปและภาพจากกล้องอยู่ในเครื่องของคุณเท่านั้น</p>
</div>

<div id="bar">
  <div class="slider"><span>จาง</span><input id="op" type="range" min="5" max="100" value="50" aria-label="ความโปร่งใสของรูป"><span>ชัด</span></div>
  <div class="row">
    <label class="btn primary">เลือกรูป<input id="file" type="file" accept="image/*"></label>
    <button id="lock" aria-pressed="false">ล็อกรูป</button>
    <button id="flip">กลับด้าน</button>
    <button id="reset">รีเซ็ต</button>
  </div>
</div>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var cam=$('cam'),pic=$('pic'),stage=$('stage'),bar=$('bar'),msg=$('msg');
  var st={x:0,y:0,s:1,r:0,flip:1},locked=false;
  var ptrs=new Map(),last=null;

  function show(t){msg.textContent=t;msg.style.display='block'}
  function draw(){
    pic.style.transform='translate(-50%,-50%) translate('+st.x+'px,'+st.y+'px) rotate('+st.r+'rad) scale('+(st.s*st.flip)+','+st.s+')';
  }

  $('go').onclick=async function(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      show('เบราว์เซอร์นี้เปิดกล้องไม่ได้ ลองเปิดลิงก์ใน Safari หรือ Chrome');return;
    }
    try{
      var stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920}},audio:false});
      cam.srcObject=stream;await cam.play();
      $('start').style.display='none';bar.classList.add('on');
      try{if(navigator.wakeLock)navigator.wakeLock.request('screen')}catch(e){}
    }catch(e){
      show('เปิดกล้องไม่ได้ ให้อนุญาตการใช้กล้องของเบราว์เซอร์ แล้วลองกดอีกครั้ง');
    }
  };

  $('file').onchange=function(e){
    var f=e.target.files[0];if(!f)return;
    pic.onload=function(){URL.revokeObjectURL(pic.src);pic.hidden=false;st={x:0,y:0,s:1,r:0,flip:st.flip};draw()};
    pic.src=URL.createObjectURL(f);
    pic.style.opacity=$('op').value/100;
  };
  $('op').oninput=function(){pic.style.opacity=this.value/100};
  $('lock').onclick=function(){
    locked=!locked;this.setAttribute('aria-pressed',locked);
    this.textContent=locked?'ปลดล็อก':'ล็อกรูป';
  };
  $('flip').onclick=function(){st.flip*=-1;draw()};
  $('reset').onclick=function(){st={x:0,y:0,s:1,r:0,flip:1};draw()};

  function two(){
    var p=Array.from(ptrs.values());
    return {cx:(p[0].x+p[1].x)/2,cy:(p[0].y+p[1].y)/2,d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),a:Math.atan2(p[1].y-p[0].y,p[1].x-p[0].x)};
  }
  stage.addEventListener('pointerdown',function(e){
    if(locked||pic.hidden||bar.contains(e.target))return;
    stage.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    last=ptrs.size===2?two():null;
  });
  stage.addEventListener('pointermove',function(e){
    var p=ptrs.get(e.pointerId);if(!p)return;
    var ox=p.x,oy=p.y;p.x=e.clientX;p.y=e.clientY;
    if(ptrs.size===1){st.x+=p.x-ox;st.y+=p.y-oy}
    else if(ptrs.size===2){
      var n=two();
      if(last){st.x+=n.cx-last.cx;st.y+=n.cy-last.cy;st.s=Math.max(.1,Math.min(10,st.s*n.d/last.d));st.r+=n.a-last.a}
      last=n;
    }
    draw();
  });
  function up(e){ptrs.delete(e.pointerId);last=ptrs.size===2?two():null}
  stage.addEventListener('pointerup',up);
  stage.addEventListener('pointercancel',up);
  if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
})();
</script>
</body>
</html>
